server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # The voice detector's ONNX runtime is a 14 MB WebAssembly binary that gzips
    # down to 3.4 MB, so application/wasm matters more here than anything else.
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The detector's runtime, model and worklet are pinned versions copied at build
    # time, so a browser downloads those 17 MB once and never asks again.
    location /vad/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's built in types have no .mjs. The voice detector loads its speech runtime
    # (/vad/ort-wasm-simd-threaded.mjs) as a JavaScript module, and browsers refuse a
    # module sent as a plain download, which broke voice mode before the mic was asked for.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
    }

    # The app is a single page application, so paths like /chat/abc are not files
    # on disk. Without this, a browser refresh on any route returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
